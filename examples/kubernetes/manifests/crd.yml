apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: localservicedeployments.colors.getcolors.ai
spec:
  group: colors.getcolors.ai
  scope: Namespaced
  names:
    plural: localservicedeployments
    singular: localservicedeployment
    kind: LocalServiceDeployment
    shortNames: [lsd]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .spec.state
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Profile
          type: string
          jsonPath: .status.profile
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [config]
              properties:
                state:
                  type: string
                  enum: [running, stopped]
                  default: running
                suspend:
                  type: boolean
                  default: false
                reconcileInterval:
                  type: string
                  pattern: '^[1-9][0-9]*(ms|s|m|h)$'
                  default: 60s
                deletionPolicy:
                  type: string
                  enum: [Retain, Destroy]
                  default: Retain
                config:
                  type: object
                  required: [replicas, message]
                  x-kubernetes-validations:
                    - rule: 'has(self.profile) == has(oldSelf.profile)'
                      message: profile presence is immutable
                  properties:
                    profile:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: profile is immutable
                    replicas:
                      type: integer
                      minimum: 0
                      maximum: 5
                    message:
                      type: string
                      maxLength: 256
                    compute-prevent-destroy:
                      type: boolean
                      default: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
